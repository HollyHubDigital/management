<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shield Device Admin Login</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section id="adminGate" class="admin-gate panel">
        <p class="eyebrow">Shield Device Agent ADMIN</p>
        <h1>Control Interface Login</h1>
        <p class="gate-copy">Enter valid admin credentials to access device control.</p>
        <input id="adminLogin" placeholder="Admin username" autocomplete="username" />
        <input id="adminPassword" type="password" placeholder="Admin password" autocomplete="current-password" />
        <button id="adminLoginButton">Admin Login</button>
        <pre id="loginStatus"></pre>
        <input id="adminToken" type="hidden" />
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
