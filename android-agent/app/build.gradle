plugins { id "com.android.application" }

android {
    namespace "com.cpdevice.agent"
    compileSdk 35

    defaultConfig {
        applicationId "com.cpdevice.agent"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("CP_DEVICE_KEYSTORE") ?: "release.keystore")
            storePassword System.getenv("CP_DEVICE_KEYSTORE_PASSWORD") ?: "changeit"
            keyAlias System.getenv("CP_DEVICE_KEY_ALIAS") ?: "cp-device"
            keyPassword System.getenv("CP_DEVICE_KEY_PASSWORD") ?: "changeit"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies { implementation 'androidx.core:core:1.13.1' }

